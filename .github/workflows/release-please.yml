name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  # release-please.yml approves its release PR's CI runs.
  actions: write
  packages: write

jobs:
  release:
    uses: chodeus/chodeus-ops/.github/workflows/release-please.yml@1fcf653ea7ccc8c3cc5b8897d38c4b3f640010c0 # main

  # Tags created by release-please use GITHUB_TOKEN, which does not trigger
  # other workflows — so we publish the image here, gated on the release
  # output, instead of relying on a push:tags trigger.
  docker:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tag: ${{ needs.release.outputs.tag_name }}
