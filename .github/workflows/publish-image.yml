name: Publish image

# Called by release-please.yml with the new tag. Without one (a dependency push to main, the
# image refresh, or by hand) it builds main and publishes it under the latest release's tags.

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build, e.g. v1.4.2.'
        required: true
        type: string
    secrets:
      DISCORD_WEBHOOK_URL:
        required: false
  # Dependency bumps ship as an image rebuild, not a release.
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - 'Dockerfile'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build. Empty = main, under the latest release tags.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  docker:
    # queue: max keeps every waiting run; the default replaces a pending one and would drop a release build.
    concurrency:
      group: publish-image
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      superseded_by: ${{ steps.latest.outputs.superseded_by }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$TAG_INPUT" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::without a tag only main is built, not ${GITHUB_REF}."; exit 1
          fi
          tag="${TAG_INPUT:-$(gh release view --json tagName --jq .tagName)}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${tag}' is not vX.Y.Z."; exit 1
          fi
          version="${tag#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"
          ref="${TAG_INPUT:+$tag}"
          ref="${ref:-$GITHUB_SHA}"
          {
            echo "tag=${tag}"
            echo "ref=${ref}"
            echo "version=${version}"
            echo "major=${major}"
            echo "minor=${minor}"
          } >> "$GITHUB_OUTPUT"
          echo "Building ${ref} as ${tag} (${version}, ${major}.${minor})"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built locally and gated before anything reaches GHCR; the push step
      # below reuses this build's cache.
      - name: Build image (local, no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: lama-sidecar:release-test

      # Same gate as ci.yml. An accepted fixable CVE goes in .trivyignore.yaml with
      # its rationale.
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # The action's default trivy trails its own releases; pin the scanner.
          version: v0.76.1 # renovate: aquasecurity/trivy
          image-ref: lama-sidecar:release-test
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml

      # Cache the model file (keyed on its MD5) so we don't re-download 200MB
      # every release; shares the cache ci.yml populates on main.
      - name: Restore model cache
        id: model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: model-cache/big-lama.pt
          key: big-lama-e3aa4aaa15225a33ec84f9f4bc47e500

      - name: Download model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p model-cache
          curl -fSL https://github.com/Sanster/models/releases/download/add_big_lama/big-lama.pt \
            -o model-cache/big-lama.pt

      - name: Verify model checksum
        run: echo "e3aa4aaa15225a33ec84f9f4bc47e500  model-cache/big-lama.pt" | md5sum -c -

      # Writable mount: /detect and /upscale download their models into /models
      # as uid 99, hence the chmod.
      - name: Start container
        run: |
          chmod 777 model-cache
          docker run -d --name lama -p 8418:8418 \
            -v "$PWD/model-cache:/models" lama-sidecar:release-test

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8418/health | grep -q '"model_loaded":true'; then
              echo "healthy after ${i} tries"; exit 0
            fi
            sleep 5
          done
          echo "container never became healthy"; docker logs lama; exit 1

      - name: Smoke test (real inpaint)
        run: |
          pip install requests pillow numpy
          python test_smoke.py http://localhost:8418

      - name: Container logs on failure
        if: failure()
        run: docker logs lama || true

      # Checked at publication time, so a release published mid-build is not overtaken, and a
      # main build only tags the newest main; anything older keeps just its sha tag.
      - name: Decide which tags to publish
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          set -euo pipefail
          latest=$(gh release view --json tagName --jq .tagName)
          is_latest=false; version_tags=true
          [ "$TAG" = "$latest" ] && is_latest=true
          if [ "$REF" != "$TAG" ]; then
            if ! head=$(git ls-remote --exit-code origin refs/heads/main | cut -f1); then
              echo "::error::Could not read main from origin, so nothing is published."; exit 1
            fi
            if [ "$head" != "$REF" ] || [ "$is_latest" != true ]; then
              is_latest=false; version_tags=false
              echo "::warning::main is now ${head:0:7} and the latest release ${latest}, so this build of ${REF:0:7} publishes only its sha tag."
            fi
            if [ "$head" != "$REF" ]; then echo "superseded_by=${head}" >> "$GITHUB_OUTPUT"; fi
          fi
          {
            echo "is_latest=${is_latest}"
            echo "version_tags=${version_tags}"
          } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # Labels and the sha tag come from the checked-out ref, not the dispatching commit.
          context: git
          images: ghcr.io/chodeus/lama-sidecar
          tags: |
            type=raw,value=${{ steps.tag.outputs.version }},enable=${{ steps.latest.outputs.version_tags }}
            type=raw,value=${{ steps.tag.outputs.major }}.${{ steps.tag.outputs.minor }},enable=${{ steps.latest.outputs.is_latest }}
            type=sha
            type=raw,value=latest,enable=${{ steps.latest.outputs.is_latest }}

      - name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # A push outside the path filter starts no build, so an overtaken main build queues one for the new head.
  replace:
    needs: docker
    if: needs.docker.outputs.superseded_by != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Queue a build of main's new head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ needs.docker.outputs.superseded_by }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          waiting=$(gh run list --workflow publish-image.yml --limit 50 --json databaseId,headSha,status \
            --jq "[.[] | select(.headSha == \"${HEAD_SHA}\" and .status != \"completed\" and .databaseId != ${RUN_ID})] | length")
          if [ "$waiting" -gt 0 ]; then
            echo "A build of ${HEAD_SHA:0:7} is already queued or running."
            exit 0
          fi
          gh workflow run publish-image.yml --ref main
          echo "Queued a build of main (${HEAD_SHA:0:7})."

  notify-failure:
    needs: [docker, replace]
    if: failure()
    permissions: {}
    uses: chodeus/chodeus-ops/.github/workflows/notify-discord.yml@cbd544d21103cfe854c8e0ec717ee2be4f097ad7 # main
    with:
      event_type: build
      status: failure
      title: "❌ Image publish failed: ${{ inputs.tag || 'main' }}"
      commit_sha: ${{ github.sha }}
    secrets:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
