# .coderabbit.yaml — lama-sidecar
# CPU-only LaMa inpainting sidecar for CHUB: FastAPI API (app.py) over a
# TorchScript model pipeline (lama.py) with pure-numpy mask geometry
# (regions.py) and lazily-fetched detect/upscale models.
language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!CHANGELOG.md"                  # release-please owns it
    - "!.release-please-manifest.json"

  path_instructions:
    - path: "**/*.py"
      instructions: |-
        lama-sidecar review rules — flag violations of these invariants:
        - ONLY-MASKED-PIXELS-CHANGE CONTRACT: every composite onto the output
          image must clamp its paste alpha under the (dilated) hole mask —
          the ImageChops.darker(blurred, hard_mask) pattern. Any code path
          that could alter a pixel outside the mask is a bug, no matter how
          subtle the change (feather, seam match, refine passes included).
        - HEURISTICS FAIL NO-OP: best-effort helpers (mask snap, boundary
          refine, seam match, text detect) must return their input unchanged
          on EVERY bail-out path — empty ring, busy content, over-budget
          crop, failed download. "Do its best on ambiguous input" is a bug;
          the fallback is always the un-helped behaviour.
        - regions.py stays torch-free pure numpy (the fast CI job unit-tests
          it without the model); torch/model code belongs in lama.py only.
        - BOUNDED INPUTS: anything request-derived that sizes an array, a
          crop, or a loop (mask runs, component counts, refine crop pixels,
          base64/pixel payloads) needs an explicit cap checked BEFORE the
          expensive work, so one request can't pin the single-slot worker.
        - Secrets & artifacts: API-key comparison stays hmac.compare_digest;
          model downloads stay checksum-verified before replacing a cached
          file (verify-then-mv, never verify-after-install).
    - path: "Dockerfile"
      instructions: |-
        Keep: non-root runtime (99:100 for Unraid), digest-pinned base image,
        CPU-only torch from the pytorch index (not PyPI's CUDA build), and
        setuptools patched LAST so no later pip step reintroduces the base
        image's vulnerable version.
        Also: never bake a secret into ARG/ENV or a RUN argv (both persist in
        image history), and don't let a recursive chown/chmod follow a COPY —
        it re-materialises the whole tree in a new layer. Use COPY --chown.
    - path: "test_*.py"
      instructions: |-
        Tests (run without the model in the fast CI job):
        - No side-effecting call inside an assert — python -O strips assert
          statements and takes the call with them. Bind to a local, then assert.
        - A guard that cannot fail is worse than none: an assertion reachable
          only when a list is non-empty passes vacuously. Pair it with a control
          that fails when the defect is injected.
        - test_regions.py must stay importable without torch, or the fast job
          silently starts testing nothing.
    - path: "requirements.txt"
      instructions: |-
        Dependency manifest for a CPU-only image:
        - torch/torchvision must stay the CPU wheels; a change pulling the
          default PyPI build drags in CUDA and multiplies the image size.
        - An extra pulls that extra's whole transitive set — confirm the code
          path needing it still exists. Deleting a feature must drop its
          dependency in the same change.
        - A pin whose only justification is dodging a CVE in a transitive dep:
          check the consumer is still reachable, then drop it rather than
          maintain the pin.
    - path: "entrypoint.sh"
      instructions: |-
        Quote every variable expansion, fail fast on missing required config,
        and never echo the API key — including under `set -x`.
    - path: ".github/workflows/**"
      instructions: |-
        CI and the GHCR release:
        - A security gate (Trivy, audit) that becomes non-blocking must have
          every downstream step that relied on it audited in the same change.
        - Enumerate allowed states positively (== 'success' || == 'skipped'),
          never by negation — a third state slips through `!= 'failure'`.
        - Pin third-party actions by commit SHA; never echo a token or
          interpolate untrusted input straight into a `run:` block.
    - path: "**"
      instructions: |-
        Applies to every file, whatever the language:
        - Comments are navigational or instructional only and capped at 1-2 lines:
          what a non-obvious block does, or the gotcha it guards. No why/history
          essays, no before/after narrative, no restating the code, no section
          banners. Docstrings: one line unless the signature genuinely cannot
          carry it.
        - The 1-2 line cap wins even inside an already heavily-commented file —
          matching local density is not licence to exceed it.

  tools:
    gitleaks:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
